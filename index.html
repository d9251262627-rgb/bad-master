<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITA | Вход</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #059669; margin-bottom: 10px; }
        input { width: 100%; padding: 15px; margin: 20px 0; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #059669; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #047857; }
        .error { color: red; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <div id="login-screen">
            <h1>🌿 VITA</h1>
            <p>Введите Email для входа</p>
            <input type="email" id="email" placeholder="example@mail.com">
            <button onclick="login()">Войти / Регистрация</button>
            <div id="error" class="error"></div>
        </div>
        <div id="app-screen" class="hidden">
            <h1>Добро пожаловать!</h1>
            <p id="user-email"></p>
            <button onclick="logout()" style="background:#ef4444">Выйти</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://yrfheqvpiuqzncgqhgrwn.supabase.co';
        const supabaseKey = 'sb_publishable_RixoV9Q-BGCygKgIREwaEg_jN1QabOe';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function login() {
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('error');
            
            if (!email.includes('@')) {
                errorDiv.textContent = 'Введите корректный email';
                return;
            }

            errorDiv.textContent = 'Загрузка...';
            
            // Пробуем войти
            let { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: 'vita123'
            });

            // Если не вышло - регистрируем
            if (error) {
                const { data: regData, error: regError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: 'vita123'
                });
                
                if (regError) {
                    errorDiv.textContent = regError.message;
                    return;
                }
                alert('✅ Регистрация успешна! Войдите еще раз.');
                errorDiv.textContent = '';
                return;
            }

            // Успешный вход
            showApp(email);
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function showApp(email) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-email').textContent = email;
        }

        // Проверяем сессию при загрузке
        window.onload = async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showApp(session.user.email);
            }
        };
    </script>
</body>
</html>
